name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Arrange files
        run: |
          mkdir -p www assets
          cp index.html bg.webp www/
          cp icon.png assets/icon.png
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
      - run: npm install -D @capacitor/assets
      - run: npx cap add android
      - name: Add sound, permissions and native code
        run: |
          D=android/app/src/main
          mkdir -p $D/res/raw
          cp alarm.wav $D/res/raw/alarm.wav
          sed -i '/<application/e cat permissions.txt' $D/AndroidManifest.xml
          cp MainActivity.java PowerPlugin.java $D/java/com/glassclock/app/
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: glass-clock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
